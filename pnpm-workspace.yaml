packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^26.6.6
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  effect: ^4.1.2
  jose: ^6.2.14
  postgres: ^4.0.0
  typescript: ~6.0.3
  vitest: ^5.0.5

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

# drizzle-kit's legacy TS loader uses only the compatible transform API.
# Keep its nested esbuild above GHSA-67mh-4wv8-2f99's patched floor.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
